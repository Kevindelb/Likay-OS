# Drop-in, no se toca el ollama.service original (lo instala el script
# de Ollama, no es un archivo nuestro). Mismo motivo que la condición
# equivalente en kal-in-backend.service: encontrado probando
# likay-installer.service en QEMU (2026-09-14) -- Ollama no tiene
# ninguna razón para estar corriendo en modo instalador (Calamares no
# lo usa), es superficie innecesaria mientras hay acceso privilegiado
# al disco de por medio. Ver docs/ROADMAP.md, Etapa 2.
[Unit]
ConditionKernelCommandLine=!likay.mode=installer
