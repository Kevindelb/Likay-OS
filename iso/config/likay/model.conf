# Fuente única del tag de modelo a hornear en la ISO — lo lee tanto
# auto/build (host, para sembrar el cache) como el hook que hace el pull
# dentro del chroot (vía /etc/likay-os/model.conf, copiado por auto/build).
#
# Este es el LLM propio de Likay-OS (clasificación de intención +
# orientación del usuario al arranque — ver docs/ROADMAP.md, Etapa 1),
# NO el LLM de trabajo del agente que se monte encima (kal-in u otro) —
# ese es asunto del agente, con su propia config, y puede ser un modelo
# completamente distinto. Chico a propósito: qwen2.5:3b, no un modelo de
# tareas pesadas — clasificar intención no lo necesita.
MODEL_TAG="qwen2.5:3b"
