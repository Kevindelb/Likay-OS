[project]
name = "likay-broker"
version = "0.1.0"
description = "Likay Agent Broker -- Access Manager de v1 para agentes montados en Likay-OS (ver docs/AGENT_INTERFACE.md)"
requires-python = ">=3.11"
dependencies = [
    "pyyaml>=6.0",
    "jsonschema>=4.19",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "fastapi>=0.110",
    "uvicorn>=0.27",
]

[project.scripts]
likay-agent-broker = "likay_broker.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["likay_broker*"]
