name: Broker tests

on:
  push:
    paths:
      - "broker/**"
      - ".github/workflows/broker-tests.yml"
  pull_request:
    paths:
      - "broker/**"
      - ".github/workflows/broker-tests.yml"

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: broker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -e ".[dev]"
      - run: pytest -q
